# Postgres of the local sandbox, in place of Aurora PostgreSQL and the Data API.
name: lumia-studio-sandbox

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:16.15-alpine
    environment:
      POSTGRES_DB: lumia_studio
      POSTGRES_USER: lumia_admin
      POSTGRES_PASSWORD: ${LUMIA_SANDBOX_DB_PASSWORD:?}
    ports:
      - "127.0.0.1:${LUMIA_SANDBOX_DB_PORT:-5432}:5432"
    volumes:
      - lumia-studio-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumia_admin -d lumia_studio"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  lumia-studio-pg-data:
