    Hand-editable diagram. Layout: edges first, then tables, so tables stay on top.
    - Table: <g id="node-*" transform="translate(x, y)">. x, y is the top-left corner. A table grows 17 units per column, so move the tables below it and the edges that touch it when you add one.
    - Edge: <g id="edge-*">. Its path uses absolute coordinates; update it when a table it connects moves. The text at each end is its cardinality: 1, * (many) or 0..1.
    - A table with a dashed border belongs to the other diagram and is shown only to connect the two.
    Keep plain SVG: no scripts, no external files and no <foreignObject>, so GitHub and Bitbucket render it.
  -->
